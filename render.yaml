# Render Blueprint — TradingView Daily Chart (free web service)
#
# Deploy:  Render Dashboard → New → Blueprint
#          or push this repo and import it.
#
# Keep-awake:  A free Render web service sleeps after 15 min of no
#              inbound traffic. We use cron-job.org (free) to hit
#              /health every 10 minutes so the service stays up.
#
# Daily capture:  An in-process scheduler fires once per day at
#                 5:49 PM IST and runs the screenshot → Telegram
#                 job as a background task (the HTTP response
#                 returns immediately, so we never exceed
#                 cron-job.org's 30-second HTTP timeout).

services:
  - type: web
    name: tradingview-daily-chart
    env: python
    pythonVersion: 3.11.10
    plan: free
    region: frankfurt  # closest free region; adjust if you prefer
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: sh -c 'exec uvicorn chart_service:app --host 0.0.0.0 --port ${PORT:-10000} --timeout-graceful-shutdown 120'
    envVars:
      - key: TRADINGVIEW_SESSION_ID
        sync: false
      - key: TRADINGVIEW_SESSION_ID_SIGN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SYMBOL
        value: MCX:XAUUSD
      - key: INTERVAL
        value: 15
      - key: THEME
        value: dark
      - key: CAPTION
        value: XAUUSD · Daily 15m Chart
      - key: TZ
        value: Asia/Kolkata
      - key: PYTHON_VERSION
        value: 3.11.10
